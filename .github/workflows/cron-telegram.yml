# Poll due Telegram event reminders (replaces Manus Heartbeat per-event jobs).
# Runs every 5 minutes; the backend claims and delivers all due events.
name: Cron - Telegram reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger telegram reminder poll
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.BACKEND_URL }}/api/scheduled/telegram-event-reminder"
