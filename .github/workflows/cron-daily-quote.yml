# Generate the daily AI quote (00:05 +07 = 17:05 UTC previous day).
name: Cron - Daily AI quote

on:
  schedule:
    - cron: "5 17 * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily quote generation
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.BACKEND_URL }}/api/scheduled/daily-ai-quote"
